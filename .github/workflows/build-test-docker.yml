name: Build & Test Docker Images

# Automates the build/test half of what release.sh does manually: bump the
# version, build the TornadoVM Docker images, and smoke-test them on real
# GPU/iGPU hardware. Pushing to Docker Hub is a SEPARATE workflow
# (push-docker.yml) — run this one first, confirm the smoke tests pass, then
# dispatch push-docker.yml for the same version/platform to publish. That way
# a push can be retried (or re-triggered later) without rebuilding and
# re-testing images that already passed.
#
# This repo only supports JDK21 images (OpenJDK and GraalVM CE) — there is no
# JDK25 Dockerfile at all. --nvidia-arm-graalVM-JDK21 from build.sh is
# intentionally NOT wired up here: it points at
# dockerFiles/Dockerfile.nvidia.graalvm.ptx.jdk21, which does not exist (only
# ...ptx.jdk17 does, and that file has no version-pinned checkout either) —
# that image is currently broken and needs a real fix, not automation.
#
# Requires (not yet provisioned as of writing):
#   - Self-hosted runner(s) with Docker + an NVIDIA GPU, labeled
#     [self-hosted, docker-tornadovm, nvidia-gpu]
#   - Self-hosted runner(s) with Docker + Intel integrated graphics, labeled
#     [self-hosted, docker-tornadovm, intel-gpu]
#
# Images are left tagged locally (beehivelab/<image>:<version> and :latest)
# on the runner's Docker daemon for push-docker.yml to pick up — nothing is
# uploaded anywhere by this workflow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'TornadoVM release tag to build — just paste the tag as it appears on GitHub Releases, e.g. v5.0.0-jdk21 (only JDK21 is supported by this repo).'
        required: true
        type: string
      platform:
        description: 'Which images to build/test.'
        required: true
        type: choice
        options:
          - all
          - nvidia
          - intel
        default: all

concurrency:
  group: build-test-docker
  cancel-in-progress: false

jobs:
  nvidia:
    if: inputs.platform == 'all' || inputs.platform == 'nvidia'
    name: NVIDIA (build + test)
    runs-on: [self-hosted, docker-tornadovm, nvidia-gpu]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-jdk21$ ]]; then
            echo "::error::version must be the full release tag vX.Y.Z-jdk21 (this repo only builds JDK21 images), got '${{ inputs.version }}'."
            exit 1
          fi

      - name: Derive version
        id: derive
        run: echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Bump version
        run: ./bump-version.sh "${{ steps.derive.outputs.version }}"

      - name: Build NVIDIA OpenJDK21 image
        run: ./build.sh --nvidia-jdk21

      - name: Build NVIDIA GraalVM JDK21 image
        run: ./build.sh --nvidia-graalVM-JDK21

      - name: Smoke test — NVIDIA OpenJDK21
        run: |
          set -euo pipefail
          ./run_nvidia_openjdk.sh tornado --version 2>&1 | tee /tmp/nvidia-openjdk-version.log
          ./run_nvidia_openjdk.sh tornado --threadInfo -cp example/target/example-1.0-SNAPSHOT.jar example.MatrixMultiplication 2>&1 | tee /tmp/nvidia-openjdk-matmul.log
          if grep -qiE 'exception|traceback|fatal error|internal error' /tmp/nvidia-openjdk-version.log /tmp/nvidia-openjdk-matmul.log; then
            echo "::error::Smoke test output for NVIDIA OpenJDK21 contains an error/exception."
            exit 1
          fi

      - name: Smoke test — NVIDIA GraalVM JDK21
        run: |
          set -euo pipefail
          ./run_nvidia_graalvm.sh tornado --version 2>&1 | tee /tmp/nvidia-graalvm-version.log
          ./run_nvidia_graalvm.sh tornado --threadInfo -cp example/target/example-1.0-SNAPSHOT.jar example.MatrixMultiplication 2>&1 | tee /tmp/nvidia-graalvm-matmul.log
          if grep -qiE 'exception|traceback|fatal error|internal error' /tmp/nvidia-graalvm-version.log /tmp/nvidia-graalvm-matmul.log; then
            echo "::error::Smoke test output for NVIDIA GraalVM JDK21 contains an error/exception."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "## NVIDIA images built & tested — ${{ inputs.version }}"
            echo ""
            echo "Images are tagged locally on this runner. Run **push-docker.yml** with the same version to publish them to Docker Hub."
          } >> "$GITHUB_STEP_SUMMARY"

  intel:
    if: inputs.platform == 'all' || inputs.platform == 'intel'
    name: Intel (build + test)
    runs-on: [self-hosted, docker-tornadovm, intel-gpu]
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-jdk21$ ]]; then
            echo "::error::version must be the full release tag vX.Y.Z-jdk21 (this repo only builds JDK21 images), got '${{ inputs.version }}'."
            exit 1
          fi

      - name: Derive version
        id: derive
        run: echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Bump version
        run: ./bump-version.sh "${{ steps.derive.outputs.version }}"

      - name: Build Intel OpenJDK21 image
        run: ./build.sh --intel-jdk21

      - name: Build Intel GraalVM JDK21 image
        run: ./build.sh --intel-graalVM-JDK21

      - name: Smoke test — Intel OpenJDK21
        run: |
          set -euo pipefail
          ./run_intel_openjdk.sh tornado --version 2>&1 | tee /tmp/intel-openjdk-version.log
          ./run_intel_openjdk.sh tornado --threadInfo -cp example/target/example-1.0-SNAPSHOT.jar example.MatrixMultiplication 2>&1 | tee /tmp/intel-openjdk-matmul.log
          if grep -qiE 'exception|traceback|fatal error|internal error' /tmp/intel-openjdk-version.log /tmp/intel-openjdk-matmul.log; then
            echo "::error::Smoke test output for Intel OpenJDK21 contains an error/exception."
            exit 1
          fi

      - name: Smoke test — Intel GraalVM JDK21
        run: |
          set -euo pipefail
          ./run_intel_graalvm.sh tornado --version 2>&1 | tee /tmp/intel-graalvm-version.log
          ./run_intel_graalvm.sh tornado --threadInfo -cp example/target/example-1.0-SNAPSHOT.jar example.MatrixMultiplication 2>&1 | tee /tmp/intel-graalvm-matmul.log
          if grep -qiE 'exception|traceback|fatal error|internal error' /tmp/intel-graalvm-version.log /tmp/intel-graalvm-matmul.log; then
            echo "::error::Smoke test output for Intel GraalVM JDK21 contains an error/exception."
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "## Intel images built & tested — ${{ inputs.version }}"
            echo ""
            echo "Images are tagged locally on this runner. Run **push-docker.yml** with the same version to publish them to Docker Hub."
          } >> "$GITHUB_STEP_SUMMARY"
