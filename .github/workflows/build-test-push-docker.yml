name: Build, Test & Push Docker Images

# Builds the NVIDIA TornadoVM Docker images from TornadoVM's prebuilt release SDKs,
# smoke-tests them on real NVIDIA GPU hardware, and (opt-in via push_images) pushes each
# image to the beehivelab Docker Hub org:
#
#   beehivelab/tornadovm-nvidia-cuda-jdk21     CUDA backend,   Temurin JDK 21 (jdk21 SDK)
#   beehivelab/tornadovm-nvidia-cuda-jdk25     CUDA backend,   Temurin JDK 25 (jdk22plus SDK)
#   beehivelab/tornadovm-nvidia-cuda-jdk27     CUDA backend,   Temurin JDK 27 (jdk22plus SDK)
#   beehivelab/tornadovm-nvidia-opencl-jdk21   OpenCL backend, Temurin JDK 21 (jdk21 SDK)
#   beehivelab/tornadovm-nvidia-opencl-jdk25   OpenCL backend, Temurin JDK 25 (jdk22plus SDK)
#   beehivelab/tornadovm-nvidia-opencl-jdk27   OpenCL backend, Temurin JDK 27 (jdk22plus SDK)
#
# JDK 25 is the current LTS and 27 the latest feature release; both come from the same
# Dockerfile.nvidia.<backend>.jdk22plus (JDK_VERSION build-arg). To publish another JDK,
# add it to matrix.jdk below.
#
# Each is tagged with the bare release version (v7.2.0 -> 7.2.0) and `latest`.
#
# When push_images is set and every image passed, the dockerhub-descriptions job calls the
# "Update Docker Hub Descriptions" workflow (update-dockerhub-descriptions.yml) to refresh
# the Docker Hub overview pages of the active and frozen images, and the
# commit-version-bump job runs bump-version.sh for that version, rebuilds example/target/example-1.0-SNAPSHOT.jar
# with Maven against the matching tornado-api on Maven Central, and commits both back
# to the branch the workflow ran on.
#
# The Intel images, the GraalVM images, and the source-built nvidia-openjdk /
# nvidia-jdk22plus images are DEPRECATED and no longer built here (their Dockerfiles and
# build.sh flags remain for manual builds).
#
# Each image is its own matrix leg (fail-fast off), so one failing image does not stop
# the others; build, test and push of an image all run in that one leg on the same
# runner, so the pushed image is exactly the one that was tested. If a leg fails (e.g. a
# Docker Hub network blip), use GitHub's "Re-run failed jobs" — the other legs are not
# rerun.
#
# Requires:
#   - Self-hosted runner(s) with Docker + the NVIDIA container runtime + an NVIDIA GPU
#     (driver supporting CUDA 13), labeled [self-hosted, docker-tornadovm, nvidia-gpu]
#   - Repo secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN with push rights to the
#     beehivelab org (only read when push_images=true)
#   - A self-hosted runner with Docker, labeled [self-hosted, docker-tornadovm], for the
#     version-bump commit job (no GPU needed)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'TornadoVM release version, vX.Y.Z (e.g. v7.2.0). Selects the prebuilt SDK and becomes the image tag (without the "v").'
        required: true
        type: string
      push_images:
        description: 'Push built images to Docker Hub (beehivelab org) and commit the version bump back to this repo. Leave unchecked for a build+test-only dry run.'
        required: false
        type: boolean
        default: false

concurrency:
  group: build-test-push-docker
  cancel-in-progress: false

jobs:
  nvidia:
    name: NVIDIA ${{ matrix.backend }} JDK${{ matrix.jdk }}
    runs-on: [self-hosted, docker-tornadovm, nvidia-gpu]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [cuda, opencl]
        jdk: [21, 25, 27]
    env:
      IMAGE: beehivelab/tornadovm-nvidia-${{ matrix.backend }}-jdk${{ matrix.jdk }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be a release version vX.Y.Z, got '${{ inputs.version }}'."
            exit 1
          fi

      - name: Derive version
        id: derive
        run: echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Build image
        run: ./build.sh --nvidia-${{ matrix.backend }}-jdk${{ matrix.jdk }}
        env:
          TORNADOVM_VERSION: ${{ steps.derive.outputs.version }}

      - name: Verify image was built
        run: |
          if ! docker image inspect "$IMAGE:${{ steps.derive.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::$IMAGE:${{ steps.derive.outputs.version }} was not built."
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          LOG_PREFIX=/tmp/nvidia-${{ matrix.backend }}-jdk${{ matrix.jdk }}
          # Compile the example inside the image against the image's own tornado-api, so
          # the test never depends on the committed (possibly stale) example jar.
          WORK="$RUNNER_TEMP/example-${{ matrix.backend }}-jdk${{ matrix.jdk }}"
          rm -rf "$WORK" && mkdir -p "$WORK/classes"
          cp example/src/main/java/example/MatrixMultiplication.java "$WORK/"
          run() {
            docker run --runtime=nvidia --rm -i --user="$(id -u):$(id -g)" --net=none \
              -v "$WORK":/data "$IMAGE:${{ steps.derive.outputs.version }}" "$@"
          }
          # The host driver as seen from the container (driver version, max CUDA version).
          run nvidia-smi || echo "::warning::nvidia-smi failed inside $IMAGE"
          # The jdk21 SDK's tornado-api uses Java 21 preview features (FFM), so compiling
          # against it needs --enable-preview; the jdk22plus SDK's does not.
          PREVIEW=""
          if [[ "${{ matrix.jdk }}" == 21 ]]; then PREVIEW="--enable-preview"; fi
          run bash -c "CP=\$(ls \$TORNADOVM_HOME/share/java/tornado/tornado-{api,matrices}-*.jar | paste -sd:) \
            && javac --release 21 $PREVIEW -cp \"\$CP\" -d classes MatrixMultiplication.java \
            && jar cf example.jar -C classes ."
          run tornado --version 2>&1 | tee "$LOG_PREFIX-version.log"
          run tornado --devices 2>&1 | tee "$LOG_PREFIX-devices.log"
          run tornado --threadInfo -cp example.jar example.MatrixMultiplication 512 2>&1 | tee "$LOG_PREFIX-matmul.log"
          if grep -qiE 'exception|traceback|fatal error|internal error|\[error\]' "$LOG_PREFIX"-*.log; then
            echo "::error::Smoke test output for $IMAGE contains an error/exception — failing before push."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: inputs.push_images == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: inputs.push_images == true
        run: |
          set -euo pipefail
          docker push "$IMAGE:${{ steps.derive.outputs.version }}"
          docker push "$IMAGE:latest"

      - name: Summary
        run: |
          if [[ "${{ inputs.push_images }}" == "true" ]]; then
            echo "Pushed \`$IMAGE:${{ steps.derive.outputs.version }}\` and \`$IMAGE:latest\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Built and tested \`$IMAGE:${{ steps.derive.outputs.version }}\` (dry run, not pushed)." >> "$GITHUB_STEP_SUMMARY"
          fi

  dockerhub-descriptions:
    name: Update Docker Hub descriptions
    needs: nvidia
    if: inputs.push_images == true && needs.nvidia.result == 'success'
    uses: ./.github/workflows/update-dockerhub-descriptions.yml
    with:
      images: all
      version: ${{ inputs.version }}
    secrets: inherit

  commit-version-bump:
    name: Commit version bump
    needs: nvidia
    # needs.nvidia.result is 'success' only when every matrix leg (all six images) passed.
    if: inputs.push_images == true && needs.nvidia.result == 'success'
    runs-on: [self-hosted, docker-tornadovm]
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: derive
        run: echo "version=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Bump version
        run: ./bump-version.sh "${{ steps.derive.outputs.version }}"

      - name: Rebuild example jar
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Repo already at ${{ steps.derive.outputs.version }} — keeping the committed example jar."
            exit 0
          fi
          M2="$RUNNER_TEMP/m2" && mkdir -p "$M2"
          docker run --rm --user="$(id -u):$(id -g)" -v "$M2":/m2 -v "$PWD/example":/src -w /src \
            maven:3.9.9-eclipse-temurin-21 \
            mvn -B -q -Duser.home=/m2 -Dmaven.repo.local=/m2/repository clean package

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit — repo already at ${{ steps.derive.outputs.version }}."
            exit 0
          fi
          git add build.sh README.md example/pom.xml \
            dockerFiles/Dockerfile.nvidia.cuda.jdk21 dockerFiles/Dockerfile.nvidia.cuda.jdk22plus \
            dockerFiles/Dockerfile.nvidia.opencl.jdk21 dockerFiles/Dockerfile.nvidia.opencl.jdk22plus
          git add -u example/target  # gitignored, but its files are tracked
          git commit -m "Bump Docker image version to ${{ steps.derive.outputs.version }}"
          git push origin HEAD:${{ github.ref_name }}
          echo "Version bump to ${{ steps.derive.outputs.version }} committed to \`${{ github.ref_name }}\`." >> "$GITHUB_STEP_SUMMARY"
